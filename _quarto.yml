project:
  type: website
  output-dir: docs
  # GitHub Pages runs Jekyll unless docs/.nojekyll exists, and `quarto render`
  # wipes the output dir -- taking .nojekyll with it -- on every build. Recreate
  # it after each render so it can never go missing from a published commit.
  post-render:
    - touch docs/.nojekyll
  # PDF exports of the released decks, generated with decktape — regenerate
  # with `bash tools/make-slide-pdfs.sh` whenever a deck changes. Declared as
  # resources so a full render, which wipes docs/, copies them back in.
  resources:
    - lectures/pdf
  # Only released material is listed here.
  render:
    - index.qmd
    - lectures.qmd
    - labs.qmd
    - readings.qmd
    - midterm.qmd
    - exam.qmd
    - lectures/lecture-01-what-is-ai.qmd
    - lectures/lecture-02-deep-models-primer.qmd
    - lectures/lecture-03-computational-graphs.qmd
    - lectures/lecture-04-backpropagation.qmd
    - lectures/lecture-05-feedforward.qmd
    - lectures/lecture-06-cnns.qmd
    - lectures/lecture-07-generative-images.qmd
    - lectures/lecture-08-text-embeddings.qmd
    - lectures/lecture-09-rnns.qmd
    - lectures/lecture-10-attention-transformers.qmd
    - lectures/lecture-11-tokenization-refinements.qmd
    # lecture 12 is held back while it is revised — restore this line, the
    # lectures.qmd entry, and its PDF when it goes back up.
    - labs/lab-01-setup-and-tensors.ipynb
    - labs/lab-02-perceptron-numpy.ipynb
    - labs/lab-03-value-forward.ipynb
    - labs/lab-04-backprop-autograd.ipynb
    - labs/lab-05-pytorch-feedforward.ipynb
    - labs/lab-06-cnn-images.ipynb
    - labs/lab-07-autoencoders-vae.ipynb
    - labs/lab-08-char-bigram.ipynb
    - labs/lab-09-rnn.ipynb
    - labs/lab-10-transformer-gpt.ipynb
    - labs/lab-11-bpe-sampling-capstone.ipynb
    - labs/lab-12-ethics-redteam.ipynb
    - assessment/midterm-starter.ipynb
  preview:
    port: 4200
    browser: true

# ---------------------------------------------------------------------------
# Website (the GitHub Pages site). Pages render to HTML; the lecture decks in
# lectures/*.qmd keep `format: revealjs` in their own front matter, so they
# still build as slide decks and are linked from the Lectures page.
# ---------------------------------------------------------------------------
website:
  title: "ME324 · AI & Deep Learning"
  description: "LSE Summer School — a three-week intensive introduction to deep learning and modern AI."
  # Project site under the tsrobinson.github.io user site, which carries the
  # custom domain ts-robinson.com -- GitHub serves project repos owned by the
  # same account at <custom-domain>/<repo>. Do NOT add a CNAME file to this
  # repo: it inherits the domain, and a CNAME here would hijack the apex.
  site-url: "https://ts-robinson.com/me324/"
  repo-url: "https://github.com/tsrobinson/me324"
  repo-actions: [source]
  open-graph: true
  navbar:
    # Cobalt sampled from the hero banner, replacing the near-black navy.
    background: "#183D87"
    foreground: "#F7F1E3"
    pinned: true
    left:
      - href: index.qmd
        text: Home
      - href: lectures.qmd
        text: Lectures
      - href: labs.qmd
        text: Labs
      - href: midterm.qmd
        text: Midterm
      - href: exam.qmd
        text: Exam
      - href: readings.qmd
        text: Readings
    right:
      - icon: github
        href: "https://github.com/tsrobinson/me324"
        aria-label: GitHub repository
  page-footer:
    border: true
    left: "ME324 · AI and Deep Learning · LSE Summer School"
    center: "Dr Thomas Robinson · Lab instructor: Kaifang Zhou"
    right: "Built with [Quarto](https://quarto.org)"

# ---------------------------------------------------------------------------
# Formats. `html` is first, so ordinary pages default to it. The revealjs block
# is the original deck configuration, inherited by every lecture.
# ---------------------------------------------------------------------------
format:
  html:
    theme: [cosmo, assets/theme/site.scss]
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    link-external-newwindow: true
    smooth-scroll: true
    anchor-sections: true
    grid:
      body-width: 960px

# The lecture decks render as revealjs via lectures/_metadata.yml (keeps the
# website pages HTML-only, so their output names don't collide on render).

bibliography: refs.bib
csl: https://www.zotero.org/styles/apa

editor: source
